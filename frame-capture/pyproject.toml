[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamestat-frame-capture"
version = "0.1.0"
description = "Python collector and analyzer for GameStat Linux frame capture hooks"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
